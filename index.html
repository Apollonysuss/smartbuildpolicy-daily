<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能建造商业情报雷达</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--muted:#687385;--line:#dbe1e8;--accent:#146c72;--hot:#b42318;--soft:#e4f2f1;--hotsoft:#fee4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 40px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;border-bottom:1px solid var(--line);padding:8px 0 18px}h1{margin:0;font-size:28px;letter-spacing:0}.sub,.time,.meta,.small{color:var(--muted)}.sub{margin-top:6px}.time{white-space:nowrap;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.metric,.card,.side{background:var(--card);border:1px solid var(--line);border-radius:8px}.metric{padding:14px}.metric b{display:block;margin-top:6px;font-size:26px}.toolbar{display:grid;grid-template-columns:1.5fr repeat(3,minmax(120px,.5fr));gap:10px;margin-bottom:16px}input,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit;padding:10px 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr)310px;gap:16px;align-items:start}.list{display:grid;gap:12px}.card{padding:16px}.head{display:flex;justify-content:space-between;gap:14px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:12px}.tag{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#394150;font-size:12px}.good{background:var(--soft);color:var(--accent)}.hot{background:var(--hotsoft);color:var(--hot)}.title{display:block;color:var(--ink);font-size:17px;font-weight:720;line-height:1.45;text-decoration:none}.title:hover{color:var(--accent)}.score{min-width:74px;text-align:right}.score b{display:block;color:var(--accent);font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.insight{background:#f8fafb;border:1px solid #edf1f4;border-radius:8px;padding:10px}.insight strong{display:block;color:#3d4754;font-size:12px;margin-bottom:4px}.entities{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.side{position:sticky;top:16px;padding:14px}.side h2{margin:0 0 10px;font-size:16px}.rank{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.rank:first-of-type{border-top:0;margin-top:0;padding-top:0}.rank a{color:var(--ink);font-weight:650;text-decoration:none}.empty{background:white;border:1px solid var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}@media(max-width:860px){.top{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar,.layout,.grid{grid-template-columns:1fr}.side{position:static}}@media(max-width:520px){.shell{width:calc(100% - 22px);padding-top:14px}h1{font-size:23px}.metrics{grid-template-columns:1fr}.head{flex-direction:column}.score{text-align:left}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><h1>智能建造商业情报雷达</h1><div class="sub">政策、招采、项目与企业动态的市场机会看板</div></div><div class="time" id="time">数据加载中</div></header>
    <section class="metrics" id="metrics"></section>
    <section class="toolbar"><input id="q" type="search" placeholder="搜索标题、地区、企业或机会关键词"><select id="cat"><option value="">全部类型</option></select><select id="region"><option value="">全部地区</option></select><select id="score"><option value="0">全部价值</option><option value="5">5分高价值</option><option value="4">4分以上</option><option value="3">3分以上</option></select></section>
    <section class="layout"><div class="list" id="list"><div class="empty">正在加载数据...</div></div><aside class="side"><h2>高价值线索</h2><div id="rank"></div></aside></section>
  </main>
  <script>
    let all=[],shown=[];const $=id=>document.getElementById(id);const regions=["北京","上海","深圳","广州","江苏","浙江","广东","重庆","四川","湖北","湖南","河南","山东","安徽","陕西","雄安","南京","苏州","杭州","成都","武汉","郑州","长沙","合肥","西安","厦门","云南"];
    fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{all=normalize(d).sort((a,b)=>new Date(b.date)-new Date(a.date)||b.lead_score-a.lead_score);setup();filter()}).catch(()=>{$('list').innerHTML='<div class="empty">数据暂未就绪，请等待 GitHub Actions 完成抓取。</div>'});
    ['q','cat','region','score'].forEach(id=>$(id).addEventListener('input',filter));
    function normalize(data){return(Array.isArray(data)?data:[]).map(x=>{const c=x.category||inferCat(x.title||'');const s=Number(x.lead_score||inferScore(x.title||'',c));return{title:x.title||'未命名信息',link:x.link||'#',date:x.date||'',source:x.source||'行业资讯',summary:x.summary||'暂无摘要',keyword:x.keyword||'智能建造',category:c,region:x.region||inferRegion(x.title||''),entities:Array.isArray(x.entities)?x.entities:[],business_value:x.business_value||businessValue(x.title||'',c),lead_score:Math.max(1,Math.min(5,s)),lead_reason:x.lead_reason||leadReason(c),suggested_action:x.suggested_action||action(c),urgency:x.urgency||(/[招中]标|采购|公示|征求意见|申报/.test(x.title||'')?'高':'中')}})}
    function inferCat(t){if(/招标|中标|采购|成交|入围|公示/.test(t))return'招采';if(/政策|通知|意见|规划|试点|住建|标准|征求意见/.test(t))return'政策';if(/项目|工程|开工|建设|示范|园区|投资/.test(t))return'项目';if(/集团|公司|股份|科技|建工|中建|中铁|中交/.test(t))return'企业';if(/大会|峰会|论坛|博览会|交流会|年会/.test(t))return'会议';return'行业动态'}function inferRegion(t){return regions.find(r=>t.includes(r))||'全国'}function inferScore(t,c){let s=['政策','招采'].includes(c)?4:3;if(/招标|中标|采购|入围|试点|示范|专项|规划|投资|征求意见/.test(t))s++;return Math.min(s,5)}
    function businessValue(t,c){if(c==='招采')return'可能对应明确采购需求，适合核查预算、业主和供应商切入点。';if(c==='政策')return'可能带来试点、补贴、标准宣贯或地方项目机会。';if(c==='项目')return'可能包含业主、总包和智能化施工应用场景。';return'可作为智能建造、智慧工地、建筑机器人或数字化施工市场信号。'}function leadReason(c){return c+'信号明确，可能带来项目、试点、合作或销售跟进机会。'}function action(c){return c==='招采'?'核查招采主体、预算金额、采购需求和联系人。':c==='政策'?'跟进政策细则、试点申报窗口和承接单位。':c==='项目'?'识别项目业主、总包单位和智能化应用场景。':'打开原文核查主体、场景和后续商业动作。'}
    function setup(){fill('cat',[...new Set(all.map(x=>x.category))]);fill('region',[...new Set(all.map(x=>x.region))])}function fill(id,vals){vals.filter(Boolean).sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;$(id).appendChild(o)})}
    function filter(){const q=$('q').value.trim().toLowerCase(),c=$('cat').value,r=$('region').value,s=Number($('score').value||0);shown=all.filter(x=>{const h=[x.title,x.source,x.region,x.category,x.business_value,x.lead_reason,x.suggested_action,x.entities.join(' ')].join(' ').toLowerCase();return(!q||h.includes(q))&&(!c||x.category===c)&&(!r||x.region===r)&&(!s||x.lead_score>=s)});render()}
    function render(){const high=shown.filter(x=>x.lead_score>=4).length,pol=shown.filter(x=>x.category==='政策').length,bid=shown.filter(x=>x.category==='招采').length;$('metrics').innerHTML=metric('当前线索',shown.length)+metric('高价值',high)+metric('政策信号',pol)+metric('招采机会',bid);$('time').textContent='最新日期：'+(all[0]?.date||'暂无数据');$('list').innerHTML=shown.length?shown.slice(0,40).map(card).join(''):'<div class="empty">没有匹配的线索。</div>';const top=[...shown].sort((a,b)=>b.lead_score-a.lead_score||new Date(b.date)-new Date(a.date)).slice(0,6);$('rank').innerHTML=top.map(x=>'<div class="rank"><a href="'+esc(x.link)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a><div class="small">'+esc(x.region)+' · '+esc(x.category)+' · '+x.lead_score+'分</div></div>').join('')||'<div class="empty">暂无高价值线索。</div>'}
    function metric(k,v){return'<div class="metric"><span class="small">'+k+'</span><b>'+v+'</b></div>'}function card(x){return'<article class="card"><div class="head"><div><div class="meta"><span>'+esc(x.date)+'</span><span>'+esc(x.source)+'</span><span class="tag good">'+esc(x.category)+'</span><span class="tag">'+esc(x.region)+'</span><span class="tag '+(x.urgency==='高'?'hot':'')+'">紧急度 '+esc(x.urgency)+'</span></div><a class="title" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a></div><div class="score"><b>'+x.lead_score+'</b><span class="small">线索价值</span></div></div><div class="grid">'+ins('事实摘要',x.summary)+ins('商业价值',x.business_value)+ins('评分原因',x.lead_reason)+ins('建议动作',x.suggested_action)+'</div>'+entities(x.entities)+'</article>'}function ins(k,v){return'<div class="insight"><strong>'+k+'</strong>'+esc(v||'待补充')+'</div>'}function entities(e){return e.length?'<div class="entities">'+e.slice(0,8).map(n=>'<span class="tag">'+esc(n)+'</span>').join('')+'</div>':''}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
  </script>
</body>
</html>
