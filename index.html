<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔚建区域机会雷达</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --panel-2: #f9fbfb;
      --ink: #172026;
      --muted: #68737d;
      --line: #dbe2e6;
      --brand: #0f6b63;
      --brand-dark: #0a4f49;
      --brand-soft: #dff1ee;
      --blue: #245c9a;
      --blue-soft: #e4eef9;
      --amber: #936316;
      --amber-soft: #fff1d5;
      --red: #a23b32;
      --red-soft: #fde8e4;
      --green: #20734d;
      --green-soft: #e2f3e9;
      --shadow: 0 14px 42px rgba(20, 31, 38, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      background: #14252a;
      color: #eef6f5;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      padding: 4px 6px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #e9f6f3;
      color: var(--brand-dark);
      display: grid;
      place-items: center;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .brand h1 {
      font-size: 19px;
      line-height: 1.25;
      margin: 0;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: #aebfc0;
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #cddadb;
      min-height: 40px;
      text-align: left;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .nav button.active {
      outline: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav .count {
      color: #99b0b1;
      font-size: 12px;
    }

    .sidebar-section {
      display: grid;
      gap: 10px;
    }

    .sidebar-title {
      color: #94aaac;
      font-size: 12px;
      padding: 0 8px;
    }

    .owner-card {
      margin-top: auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .owner-card strong {
      display: block;
      font-size: 13px;
    }

    .owner-card span {
      display: block;
      color: #aec1c2;
      font-size: 12px;
      margin-top: 3px;
    }

    .main {
      min-width: 0;
      padding: 22px 24px 32px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .page-title p {
      color: var(--muted);
      margin: 6px 0 0;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      min-height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn:hover {
      border-color: #b7c3c8;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 96px;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 12px;
    }

    .kpi-value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .kpi-note {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) repeat(4, minmax(130px, 0.7fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .control {
      min-height: 40px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 352px;
      gap: 14px;
      align-items: start;
      min-height: 0;
    }

    .workspace-main {
      max-height: calc(100vh - 206px);
      overflow: auto;
      padding-right: 2px;
      scrollbar-gutter: stable;
    }

    .region-board,
    .opportunity-list,
    .detail-panel,
    .briefing {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .region-board {
      margin-bottom: 14px;
      padding: 14px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .region-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .region-tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 11px;
      min-height: 96px;
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .region-tile.active {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .region-name {
      font-weight: 760;
    }

    .heat {
      height: 8px;
      border-radius: 999px;
      background: #e4ebee;
      overflow: hidden;
    }

    .heat i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
    }

    .region-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .opportunity-list {
      overflow: hidden;
    }

    .list-head {
      padding: 14px 14px 0;
    }

    .cards {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .lead-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      display: grid;
      gap: 12px;
      cursor: pointer;
    }

    .lead-card.selected {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(15, 107, 99, 0.1);
    }

    .lead-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .lead-title {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      font-weight: 780;
      font-size: 16px;
      line-height: 1.35;
      text-align: left;
    }

    .lead-title:hover {
      color: var(--brand);
    }

    .lead-card:hover {
      border-color: #9bb8b3;
      box-shadow: 0 8px 24px rgba(20, 31, 38, 0.06);
    }

    .score {
      min-width: 56px;
      height: 56px;
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
    }

    .meta-row,
    .tag-row,
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .meta-row {
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #edf2f4;
      color: #42505a;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag.gov {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .tag.project {
      background: var(--green-soft);
      color: var(--green);
    }

    .tag.company {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .tag.hot {
      background: var(--red-soft);
      color: var(--red);
    }

    .lead-summary {
      color: #39444c;
      margin: 0;
    }

    .next-action {
      border-left: 3px solid var(--brand);
      background: #f4faf8;
      padding: 9px 10px;
      color: #26343a;
      border-radius: 0 8px 8px 0;
    }

    .mini-btn {
      min-height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 6px 9px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .mini-btn:hover {
      border-color: #aebbc1;
    }

    .side-stack {
      display: grid;
      gap: 14px;
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding-right: 2px;
      scrollbar-gutter: stable;
    }

    .detail-panel,
    .briefing {
      padding: 14px;
    }

    .detail-close {
      display: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      min-height: 32px;
      padding: 5px 10px;
      margin-bottom: 10px;
    }

    .detail-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .detail-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .detail-block {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
    }

    .detail-block h4 {
      margin: 0 0 7px;
      font-size: 13px;
      color: #334047;
    }

    .detail-block p {
      margin: 0;
      color: #3d4950;
    }

    .timeline {
      display: grid;
      gap: 9px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 8px;
      color: #3b464c;
      font-size: 12px;
    }

    .timeline-item time {
      color: var(--muted);
    }

    .owner-row {
      display: grid;
      gap: 8px;
    }

    .owner-chip {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: var(--panel-2);
    }

    .owner-chip strong,
    .owner-chip span {
      display: block;
    }

    .owner-chip span {
      color: var(--muted);
      font-size: 12px;
    }

    .brief-list {
      display: grid;
      gap: 10px;
    }

    .brief-item {
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .brief-item:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .brief-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .brief-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: auto;
        position: static;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .workspace-main {
        max-height: none;
        overflow: visible;
        padding-right: 0;
      }

      .side-stack {
        position: static;
        max-height: none;
        overflow: visible;
        padding-right: 0;
      }

      .detail-panel {
        display: none;
      }

      body.detail-open::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(16, 29, 35, 0.38);
        z-index: 20;
      }

      body.detail-open .detail-panel {
        display: block;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 21;
        max-height: min(72vh, 620px);
        overflow: auto;
        box-shadow: var(--shadow);
      }

      body.detail-open .detail-close {
        display: inline-flex;
        align-items: center;
      }

      .briefing {
        display: none;
      }

      .region-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .main {
        padding: 16px 12px 24px;
      }

      .topbar,
      .lead-top {
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .kpis,
      .filters,
      .region-grid {
        grid-template-columns: 1fr;
      }

      .score {
        min-width: 48px;
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">蔚</div>
        <h1>蔚建区域机会雷达</h1>
        <p>面向区域销售的智能建造机会工作台</p>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">工作视图</div>
        <nav class="nav" aria-label="工作视图">
          <button class="active" type="button" data-view="all">区域机会 <span class="count" id="navTotal">0</span></button>
          <button type="button" data-view="government">政府单位 <span class="count" id="navGov">0</span></button>
          <button type="button" data-view="project">项目机会 <span class="count" id="navProject">0</span></button>
          <button type="button" data-view="tender">招采条目 <span class="count" id="navTender">0</span></button>
          <button type="button" data-view="company">公司动态 <span class="count" id="navCompany">0</span></button>
          <button type="button" data-view="competitor">竞对动态 <span class="count" id="navCompetitor">0</span></button>
          <button type="button" data-view="brief">今日简报 <span class="count" id="navBrief">0</span></button>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">销售状态</div>
        <nav class="nav" aria-label="销售状态">
          <button type="button" data-stage="未分配">未分配 <span class="count" id="navUnassigned">0</span></button>
          <button type="button" data-stage="待跟进">待跟进 <span class="count" id="navPending">0</span></button>
          <button type="button" data-stage="跟进中">跟进中 <span class="count" id="navActive">0</span></button>
          <button type="button" data-stage="待核查">待核查 <span class="count" id="navNeedsLink">0</span></button>
        </nav>
      </div>

      <div class="owner-card">
        <strong>今日建议</strong>
        <span>优先看华南、华东、西南，政策和项目同时升温。</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-title">
          <h2>区域销售机会总览</h2>
          <p>按地区聚合政策、招采、项目和公司信号，把情报变成可跟进对象。</p>
        </div>
        <div class="top-actions">
          <button class="btn" type="button">复制今日简报</button>
          <button class="btn primary" type="button">导出区域线索</button>
        </div>
      </header>

      <section class="kpis" aria-label="关键指标">
        <div class="kpi">
          <div class="kpi-label">全国机会对象</div>
          <div class="kpi-value" id="kpiTotal">0</div>
          <div class="kpi-note">政府、项目、公司合计</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">高价值线索</div>
          <div class="kpi-value" id="kpiHigh">0</div>
          <div class="kpi-note">4分及以上，建议本周跟进</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">招采/采购信号</div>
          <div class="kpi-value" id="kpiTender">0</div>
          <div class="kpi-note">优先核查预算和联系人</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">待核查线索</div>
          <div class="kpi-value" id="kpiNeedsReview">0</div>
          <div class="kpi-note">需确认主体、阶段、预算或联系人</div>
        </div>
      </section>

      <section class="filters" aria-label="筛选">
        <input class="control" id="searchInput" type="search" placeholder="搜索地区、单位、项目、场景">
        <select class="control" id="regionFilter">
          <option value="">全部区域</option>
        </select>
        <select class="control" id="typeFilter">
          <option value="">全部对象</option>
        </select>
        <select class="control" id="scoreFilter">
          <option value="0">全部价值</option>
          <option value="5">5分</option>
          <option value="4">4分以上</option>
          <option value="3">3分以上</option>
        </select>
        <select class="control" id="ownerFilter">
          <option value="">全部负责人</option>
        </select>
      </section>

      <section class="workspace">
        <div class="workspace-main">
          <section class="region-board">
            <div class="section-head">
              <h3>区域热度</h3>
              <span>点击区域快速过滤</span>
            </div>
            <div class="region-grid" id="regionGrid"></div>
          </section>

          <section class="opportunity-list">
            <div class="list-head section-head">
              <h3>机会对象</h3>
              <span id="resultCount">0 条</span>
            </div>
            <div class="cards" id="leadList"></div>
          </section>
        </div>

        <aside class="side-stack">
          <section class="detail-panel" id="detailPanel"></section>
          <section class="briefing">
            <div class="section-head">
              <h3>今日区域简报</h3>
              <span>销售可直接转发</span>
            </div>
            <div class="brief-list" id="briefList"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const sampleLeads = [
      {
        id: "sz-gov-01",
        name: "深圳市住房和建设局",
        type: "政府单位",
        region: "华南",
        city: "深圳",
        owner: "华南销售一组",
        score: 5,
        stage: "待跟进",
        signal: "智能建造试点城市政策持续推进，关联智慧工地、建筑机器人和BIM场景。",
        why: "政策牵引强，后续会影响试点工程、示范项目和采购方向。",
        action: "核查住建局近期通知、试点工程名单和公共资源交易平台公告，优先寻找承建单位。",
        objects: ["住建局", "试点城市", "智慧工地"],
        tags: ["政策", "试点", "高价值"],
        source: "深圳市政府 / 住建局",
        link: "https://www.sz.gov.cn/",
        search: "https://www.baidu.com/s?wd=%E6%B7%B1%E5%9C%B3%20%E6%99%BA%E8%83%BD%E5%BB%BA%E9%80%A0%20%E8%AF%95%E7%82%B9",
        reachable: true,
        timeline: [
          ["04-30", "智能建造相关政策和项目动态出现"],
          ["04-25", "智慧工地、数智建造关键词升温"],
          ["04-12", "重点片区项目有数字化施工报道"]
        ],
        pitch: "看到深圳近期持续推进智能建造和智慧工地相关工作，蔚建可以从项目数字化管控、场景落地和示范工程复盘切入。"
      },
      {
        id: "sz-project-01",
        name: "深圳湾超级总部基地",
        type: "项目",
        region: "华南",
        city: "深圳",

    function uniq(values) {
      return [...new Set(values)].filter(Boolean).sort();
    }

    function initFilters() {
      resetSelect(el.region, "全部区域");
      resetSelect(el.type, "全部对象");
      resetSelect(el.score, "全部价值", [
        ["5", "5分"],
        ["4", "4分以上"],
        ["3", "3分以上"]
      ]);
      resetSelect(el.owner, "全部负责人");
      fillSelect(el.region, uniq(leads.map(item => item.region)));
      fillSelect(el.type, uniq(leads.map(item => item.type)));
      fillSelect(el.owner, uniq(leads.map(item => item.owner)));
    }

    function resetSelect(select, label, extraOptions = []) {
      select.innerHTML = "";
      const first = document.createElement("option");
      first.value = select === el.score ? "0" : "";
      first.textContent = label;
      select.appendChild(first);
      extraOptions.forEach(([value, text]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        select.appendChild(option);
      });
    }

    function fillSelect(select, values) {
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function bindEvents() {
      el.search.addEventListener("input", () => {
        state.query = el.search.value.trim().toLowerCase();
        render();
      });
      el.region.addEventListener("change", () => {
        state.region = el.region.value;
        render();
      });
      el.type.addEventListener("change", () => {
        state.type = el.type.value;
        render();
      });
      el.score.addEventListener("change", () => {
        state.score = Number(el.score.value || 0);
        render();
      });
      el.owner.addEventListener("change", () => {
        state.owner = el.owner.value;
        render();
      });

      el.sidebarButtons.forEach(button => {
        button.addEventListener("click", () => {
          const view = button.getAttribute("data-view");
          const stage = button.getAttribute("data-stage");
          if (view) {
            state.view = view;
            state.stage = "";
          }
          if (stage) {
            state.stage = stage;
            state.view = "all";
          }
          syncSidebarActive();
          render();
        });
      });
    }

    function filteredLeads() {
      return leads.filter(item => {
        const haystack = [
          item.name,
          item.type,
          item.region,
          item.city,
          item.owner,
          item.signal,
          item.why,
          item.action,
          item.objects.join(" "),
          item.tags.join(" ")
        ].join(" ").toLowerCase();

        return (!state.region || item.region === state.region)
          && (!state.type || item.type === state.type)
          && (!state.score || item.score >= state.score)
          && (!state.owner || item.owner === state.owner)
          && (!state.stage || item.stage === state.stage || (state.stage === "待核查" && item.needsReview))
          && (state.view !== "government" || item.type === "政府单位")
          && (state.view !== "project" || item.type === "项目")
          && (state.view !== "tender" || isTenderLead(item))
          && (state.view !== "company" || item.type === "公司")
          && (state.view !== "competitor" || item.type === "竞对动态")
          && (state.view !== "brief" || item.score >= 4)
          && (!state.query || haystack.includes(state.query));
      }).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "zh-CN"));
    }

    function renderKpis(items) {
      const high = items.filter(item => item.score >= 4).length;
      const tender = items.filter(isTenderLead).length;
      const needsReview = items.filter(item => item.needsReview).length;

      el.kpiTotal.textContent = items.length;
      el.kpiHigh.textContent = high;
      el.kpiTender.textContent = tender;
      el.kpiNeedsReview.textContent = needsReview;
      el.navTotal.textContent = leads.length;
      el.navGov.textContent = leads.filter(item => item.type === "政府单位").length;
      el.navProject.textContent = leads.filter(item => item.type === "项目").length;
      el.navTender.textContent = leads.filter(isTenderLead).length;
      el.navCompany.textContent = leads.filter(item => item.type === "公司").length;
      el.navCompetitor.textContent = leads.filter(item => item.type === "竞对动态").length;
      el.navBrief.textContent = leads.filter(item => item.score >= 4).length;
      el.navUnassigned.textContent = leads.filter(item => item.stage === "未分配").length;
      el.navPending.textContent = leads.filter(item => item.stage === "待跟进").length;
      el.navActive.textContent = leads.filter(item => item.stage === "跟进中").length;
      el.navNeedsLink.textContent = leads.filter(item => item.needsReview).length;
    }

    function syncSidebarActive() {
      el.sidebarButtons.forEach(button => {
        const view = button.getAttribute("data-view");
        const stage = button.getAttribute("data-stage");
        const active = (view && state.view === view) || (stage && state.stage === stage);
        button.classList.toggle("active", active);
      });
    }

    function isTenderLead(item) {
      return item.tags.includes("招采")
        || item.category === "招采"
        || item.tags.some(tag => /招采|采购|公共资源|中标/.test(tag))
        || /招标|中标|采购|成交|合同|入围|遴选/.test(`${item.name} ${item.signal}`);
    }

    function renderRegions() {
      const counts = leads.reduce((acc, item) => {
        acc[item.region] = acc[item.region] || { total: 0, high: 0 };
        acc[item.region].total += 1;
        if (item.score >= 4) acc[item.region].high += 1;
        return acc;
      }, {});
      if (!Object.keys(counts).length) {
        el.regionGrid.innerHTML = '<div class="empty">暂无区域数据。</div>';
        return;
      }
      const max = Math.max(...Object.values(counts).map(item => item.total));

      const sortedRegions = Object.entries(counts).sort(([regionA, dataA], [regionB, dataB]) => {
        if (regionA === "全国") return -1;
        if (regionB === "全国") return 1;
        return dataB.total - dataA.total || dataB.high - dataA.high || regionA.localeCompare(regionB, "zh-Hans-CN");
      });

      el.regionGrid.innerHTML = sortedRegions.map(([region, data]) => `
        <button class="region-tile ${state.region === region ? "active" : ""}" type="button" data-region="${escapeAttr(region)}">
          <div class="region-name">${escapeHtml(region)}</div>
          <div class="heat"><i style="width:${Math.max(18, data.total / max * 100)}%"></i></div>
          <div class="region-meta"><span>${data.total} 条机会</span><span>${data.high} 高价值</span></div>
        </button>
      `).join("");

      [...el.regionGrid.querySelectorAll("[data-region]")].forEach(button => {
        button.addEventListener("click", () => {
          const region = button.getAttribute("data-region");
          state.region = state.region === region ? "" : region;
          el.region.value = state.region;
          render();
        });
      });
    }

    function normalizeRemoteData(data) {
      const rows = Array.isArray(data) ? data : [];
      const normalized = rows.map((item, index) => fromDataItem(item, index)).filter(Boolean);
      return normalized.length ? normalized : sampleLeads;
    }

    function fromDataItem(item, index) {
      const title = item.title || "未命名机会";
      const category = item.category || inferCategory(title);
      const city = item.region || inferCity(title);
      const salesRegion = item.sales_region || inferSalesRegion(city);
      const score = Math.max(1, Math.min(5, Number(item.lead_score || inferScore(title, category))));
      const type = inferObjectType(category, title);
      const competitorMatch = competitorNames.some(name => title.includes(name) || (Array.isArray(item.entities) && item.entities.some(entity => String(entity).includes(name))));
      const finalType = competitorMatch ? "竞对动态" : type;
      const search = item.search_link || baiduSearch(title);
      const originalLink = item.original_link || "";
      const googleLink = item.google_link || (String(item.link || "").includes("news.google.com") ? item.link : "");
      const sourceLink = originalLink || (googleLink ? search : (item.link || search));
      const reachable = item.source_access === "domestic_direct"
        || item.link_status === "原文可直达"
        || (sourceLink && !sourceLink.includes("news.google.com"));
      const primaryAction = originalLink ? "打开原文" : "搜索原文";
      const needsReview = item.source_access === "google_rss"
        || item.link_status === "需搜索核查"
        || !originalLink;

      return {
        id: item.id || `lead-${index}-${hashCode(title)}`,
        name: title,
        type: finalType,
        region: salesRegion,
        city,
        owner: item.owner || inferOwner(salesRegion),
        score,
        stage: score >= 4 ? "待跟进" : "未分配",
        signal: item.summary || item.business_value || title,
        why: item.lead_reason || item.business_value || "该信号与智能建造、智慧工地或建筑数字化相关，值得销售进一步核查。",
        action: item.suggested_action || "核查原文主体、项目阶段、招采窗口和相关承建单位。",
        objects: normalizeEntities(item.entities, finalType, city),
        tags: normalizeTags(category, item.source_channel, reachable, score, finalType),
        source: item.source || "行业资讯",
        link: sourceLink,
        originalLink,
        googleLink,
        search,
        primaryAction,
        reachable,
        needsReview,
        timeline: [
          [formatShortDate(item.date), item.summary || title],
          ["原文核查", "用原文、官网或招采平台确认主体、项目阶段、预算和联系人"],
          ["跟进", item.suggested_action || "补齐业主、总包、预算和联系人"]
        ],
        pitch: makePitch(title, city, category, item.business_value)
      };
    }

    function normalizeEntities(entities, type, city) {
      const base = Array.isArray(entities) ? entities.filter(Boolean).slice(0, 4) : [];
      if (base.length) return base;
      if (type === "政府单位") return ["住建部门", "主管单位", city];
      if (type === "项目") return ["项目业主", "总包单位", "智能建造场景"];
      if (type === "公司") return ["企业主体", "数字化部门", "项目团队"];
      return ["线索主体", "区域销售", "市场团队"];
    }

    function normalizeTags(category, channel, reachable, score, type) {
      const tags = [category || "行业动态"];
      if (channel) tags.push(channel);
      if (score >= 4) tags.push("高价值");
      if (type === "竞对动态") tags.push("竞对");
      return [...new Set(tags)];
    }

    function inferCategory(title) {
      if (/招标|中标|采购|成交|入围|合同/.test(title)) return "招采";
      if (/政策|通知|意见|规划|试点|住建|标准|方案/.test(title)) return "政策";
      if (/项目|工程|开工|建设|示范|园区|基地/.test(title)) return "项目";
      if (/集团|公司|股份|科技|建工|中建|中铁|中交/.test(title)) return "企业";
      if (/大会|峰会|论坛|博览会|交流会|会议/.test(title)) return "会议";
      return "行业动态";
    }

    function inferObjectType(category, title) {
      if (category === "政策" || /住建|政府|厅|局|委/.test(title)) return "政府单位";
      if (category === "招采" || category === "项目" || /项目|工程|基地|园区|招标|中标/.test(title)) return "项目";
      if (category === "企业" || /集团|公司|股份|科技|建工|中建|中铁|中交/.test(title)) return "公司";
      if (competitorNames.some(name => title.includes(name))) return "竞对动态";
      return "线索";
    }

    function inferCity(title) {
      const cities = ["北京", "上海", "深圳", "广州", "江苏", "浙江", "广东", "重庆", "四川", "湖北", "湖南", "河南", "山东", "安徽", "陕西", "雄安", "南京", "苏州", "杭州", "成都", "武汉", "郑州", "长沙", "合肥", "西安", "厦门"];
      return cities.find(city => title.includes(city)) || "全国";
    }

    function inferSalesRegion(city) {
      if (/北京|天津|河北|雄安/.test(city)) return "华北";
      if (/上海|江苏|浙江|安徽|山东|南京|苏州|杭州|合肥/.test(city)) return "华东";
      if (/广东|深圳|广州|厦门|福建|广西|海南/.test(city)) return "华南";
      if (/湖北|湖南|河南|武汉|长沙|郑州/.test(city)) return "华中";
      if (/四川|重庆|成都|贵州|云南/.test(city)) return "西南";
      if (/陕西|西安|甘肃|宁夏|新疆|青海/.test(city)) return "西北";
      return "全国";
    }

    function inferOwner(region) {
      const owners = {
        "华北": "华北销售组",
        "华东": "华东销售组",
        "华南": "华南销售组",
        "华中": "华中销售组",
        "西南": "西南销售组",
        "西北": "西北销售组"
      };
      return owners[region] || "市场线索池";
    }

    function inferScore(title, category) {
      let score = ["政策", "招采"].includes(category) ? 4 : 3;
      if (/招标|中标|采购|入围|试点|示范|专项|规划|项目/.test(title)) score += 1;
      return Math.min(score, 5);
    }

    function formatShortDate(value) {
      if (!value) return "最近";
      const parts = String(value).split("-");
      return parts.length >= 3 ? `${parts[1]}-${parts[2]}` : value;
    }

    function baiduSearch(title) {
      return "https://www.baidu.com/s?wd=" + encodeURIComponent(title);
    }

    function makePitch(title, city, category, businessValue) {
      return `看到${city}近期出现“${title}”相关${category}信号，蔚建可以从${businessValue || "智能建造、智慧工地和项目数字化落地"}切入，先确认主管单位、项目主体和后续招采窗口。`;
    }

    function hashCode(value) {
      let hash = 0;
      for (let i = 0; i < value.length; i += 1) {
        hash = ((hash << 5) - hash) + value.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function renderLeads(items) {
      el.resultCount.textContent = `${items.length} 条`;
      if (!items.length) {
        el.leadList.innerHTML = '<div class="empty">没有匹配的区域机会。</div>';
        renderDetail(null);
        return;
      }

      if (!items.some(item => item.id === state.selectedId)) {
        state.selectedId = items[0].id;
      }

      el.leadList.innerHTML = items.map(item => `
        <article class="lead-card ${item.id === state.selectedId ? "selected" : ""}" data-select-card="${escapeAttr(item.id)}" tabindex="0" role="button" aria-label="查看${escapeAttr(item.name)}详情">
          <div class="lead-top">
            <div>
              <button class="lead-title" type="button" data-select="${escapeAttr(item.id)}">${escapeHtml(item.name)}</button>
              <div class="meta-row">${escapeHtml(item.city)} · ${escapeHtml(item.owner)} · ${escapeHtml(item.stage)}</div>
            </div>
            <div class="score">${item.score}</div>
          </div>
          <div class="tag-row">
            <span class="tag ${typeClass(item.type)}">${escapeHtml(item.type)}</span>
            <span class="tag">${escapeHtml(item.region)}</span>
            ${item.tags.map(tag => `<span class="tag ${tag === "高价值" ? "hot" : ""}">${escapeHtml(tag)}</span>`).join("")}
          </div>
          <p class="lead-summary">${escapeHtml(item.signal)}</p>
          <div class="next-action"><strong>下一步：</strong>${escapeHtml(item.action)}</div>
          <div class="card-actions">
            <a class="mini-btn" href="${escapeAttr(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.primaryAction || "打开原文")}</a>
            <a class="mini-btn" href="${escapeAttr(item.search)}" target="_blank" rel="noopener">搜索标题</a>
            <button class="mini-btn" type="button" data-copy="${escapeAttr(item.id)}">复制话术</button>
          </div>
        </article>
      `).join("");

      [...el.leadList.querySelectorAll("[data-select-card]")].forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest("a, [data-copy]")) return;
          selectLead(card.getAttribute("data-select-card"));
        });
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectLead(card.getAttribute("data-select-card"));
          }
        });
      });

      [...el.leadList.querySelectorAll("[data-select]")].forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          selectLead(button.getAttribute("data-select"));
        });
      });

      [...el.leadList.querySelectorAll("[data-copy]")].forEach(button => {
        button.addEventListener("click", () => {
          const item = leads.find(lead => lead.id === button.getAttribute("data-copy"));
          navigator.clipboard?.writeText(item.pitch);
          button.textContent = "已复制";
          window.setTimeout(() => {
            button.textContent = "复制话术";
          }, 1200);
        });
      });

      renderDetail(leads.find(item => item.id === state.selectedId));
    }

    function selectLead(id) {
      if (!id || state.selectedId === id) return;
      state.selectedId = id;
      render();
      if (window.matchMedia("(max-width: 1180px)").matches) {
        document.body.classList.add("detail-open");
      }
    }

    function renderDetail(item) {
      if (!item) {
        el.detailPanel.innerHTML = '<div class="empty">请选择一个机会对象。</div>';
        return;
      }

      el.detailPanel.innerHTML = `
        <button class="detail-close" type="button" data-close-detail>关闭详情</button>
        <h3 class="detail-title">${escapeHtml(item.name)}</h3>
        <div class="detail-sub">${escapeHtml(item.type)} · ${escapeHtml(item.city)} · ${escapeHtml(item.owner)} · ${item.score}分</div>
        <div class="detail-block">
          <h4>为什么值得跟</h4>
          <p>${escapeHtml(item.why)}</p>
        </div>
        <div class="detail-block">
          <h4>推荐跟进对象</h4>
          <div class="tag-row">${item.objects.map(name => `<span class="tag">${escapeHtml(name)}</span>`).join("")}</div>
        </div>
        <div class="detail-block">
          <h4>近期信号</h4>
          <div class="timeline">
            ${item.timeline.map(([date, text]) => `
              <div class="timeline-item"><time>${escapeHtml(date)}</time><span>${escapeHtml(text)}</span></div>
            `).join("")}
          </div>
        </div>
        <div class="detail-block">
          <h4>原文链接</h4>
          <div class="card-actions">
            <a class="mini-btn" href="${escapeAttr(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.primaryAction || "打开原文")}</a>
            <a class="mini-btn" href="${escapeAttr(item.search)}" target="_blank" rel="noopener">搜索标题</a>
            ${item.googleLink ? `<a class="mini-btn" href="${escapeAttr(item.googleLink)}" target="_blank" rel="noopener">Google RSS备份</a>` : ""}
          </div>
        </div>
        <div class="detail-block">
          <h4>可用开场</h4>
          <p>${escapeHtml(item.pitch)}</p>
        </div>
        <div class="detail-block owner-row">
          <h4>销售处理</h4>
          <div class="owner-chip">
            <div><strong>${escapeHtml(item.owner)}</strong><span>${escapeHtml(item.stage)}</span></div>
            <span>${item.needsReview ? "待核查" : "已初筛"}</span>
          </div>
        </div>
      `;

      const close = el.detailPanel.querySelector("[data-close-detail]");
      if (close) {
        close.addEventListener("click", () => {
          document.body.classList.remove("detail-open");
        });
      }
    }

    function renderBrief(items) {
      const top = [...items].sort((a, b) => b.score - a.score).slice(0, 4);
      el.briefList.innerHTML = top.map((item, index) => `
        <div class="brief-item">
          <strong>${index + 1}. ${escapeHtml(item.city)} · ${escapeHtml(item.name)}</strong>
          <span>${escapeHtml(item.action)}</span>
        </div>
      `).join("") || '<div class="empty">暂无简报。</div>';
    }

    function typeClass(type) {
      if (type === "政府单位") return "gov";
      if (type === "项目") return "project";
      if (type === "公司") return "company";
      if (type === "竞对动态") return "hot";
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value || "");
    }

    function render() {
      const items = filteredLeads();
      renderKpis(items);
      renderRegions();
      renderLeads(items);
      renderBrief(items);
    }

    function bootstrap() {
      bindEvents();
      fetch("data.json?t=" + Date.now())
        .then(response => response.ok ? response.json() : Promise.reject(new Error("data not ready")))
        .then(data => {
          leads = normalizeRemoteData(data);
          state.selectedId = leads[0] ? leads[0].id : "";
          initFilters();
          syncSidebarActive();
          render();
        })
        .catch(() => {
          leads = sampleLeads;
          state.selectedId = leads[0].id;
          initFilters();
          syncSidebarActive();
          render();
        });
    }

    bootstrap();
  </script>
</body>
</html>
